<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
{{ partial "head.html" . }}
<body>
	{{ partial "header.html" . }}
	<main>
		{{ block "main" . }}{{ end }}
	</main>
	{{ partial "footer.html" . }}
	{{ partial "custom_footer.html" . }}
	{{ range .Site.Params.plugins_js }}
		<script src="{{ . }}"></script>
	{{ end }}
</body>
</html>
